<text x="320" y="46" text-anchor="middle" font-size="12" fill="#5c6675">docker build -t ashish-portfolio .</text>
<text x="46" y="96" font-size="12.5" xml:space="preserve"><tspan fill="#4c8dff">[1/5] </tspan><tspan fill="#e7ecf2">FROM python:3.12-slim</tspan></text>
<text x="46" y="120" font-size="12.5" xml:space="preserve"><tspan fill="#4c8dff">[2/5] </tspan><tspan fill="#e7ecf2">WORKDIR /app</tspan></text>
<text x="46" y="144" font-size="12.5" xml:space="preserve"><tspan fill="#4c8dff">[3/5] </tspan><tspan fill="#e7ecf2">RUN pip install -r requirements.txt</tspan></text>
<text x="46" y="168" font-size="12.5" xml:space="preserve"><tspan fill="#4c8dff">[4/5] </tspan><tspan fill="#e7ecf2">COPY . .</tspan></text>
<text x="46" y="192" font-size="12.5" xml:space="preserve"><tspan fill="#4c8dff">[5/5] </tspan><tspan fill="#e7ecf2">HEALTHCHECK /health</tspan></text>
<text x="46" y="216" font-size="12.5" xml:space="preserve"><tspan fill="#e7ecf2"></tspan></text>
<text x="46" y="240" font-size="12.5" xml:space="preserve"><tspan fill="#34d399">✓ </tspan><tspan fill="#e7ecf2">built ashish-portfolio:latest</tspan></text>
<text x="46" y="264" font-size="12.5" xml:space="preserve"><tspan fill="#5c6675">$ </tspan><tspan fill="#e7ecf2">docker run --rm -p 5000:5000 ashish-portfolio</tspan></text>
<text x="46" y="288" font-size="12.5" xml:space="preserve"><tspan fill="#8d98a6">  * Running on http://0.0.0.0:5000</tspan></text></svg>